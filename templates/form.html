<!DOCTYPE html>
<html>
<head>
    <title>Flask Form Handling</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:400px;
            margin:120px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        label{
            font-size:18px;
            font-weight:bold;
        }

        input[type=text]{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        input[type=submit]{
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }

        input[type=submit]:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Flask Form</h1>

<form method="POST">

<label>Enter Your Name</label>

<input type="text" name="name" placeholder="Enter your name" required>

<input type="submit" value="Submit">

</form>

</div>

</body>
</html>
